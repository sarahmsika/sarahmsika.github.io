<style>
:root{color-scheme:light;--aubergine:#4b1736;--ivory:#f4efe7;--serif:"Lora",Georgia,serif;--signature:"Bodoni Moda",Didot,"Times New Roman",serif;--sans:"Inter",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--aubergine);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
main{width:min(100% - 40px,480px);margin:0 auto;padding:clamp(36px,8vh,76px) 0 max(28px,env(safe-area-inset-bottom))}
header{text-align:center;margin-bottom:32px}
h1{margin:0;font:400 clamp(2.9rem,10vw,3.8rem)/1.2 var(--signature);letter-spacing:-.045em}
h1 em{font-weight:400}
nav{display:grid;gap:12px}
a{color:inherit;text-decoration:none}
.card{display:flex;align-items:center;justify-content:center;min-height:84px;padding:20px 24px;border:1px solid rgba(75,23,54,.35);border-radius:3px;text-align:center;transition:background .2s,transform .2s}
.card:hover{background:#eae1e2;transform:translateY(-2px)}
a:focus-visible{outline:3px solid #906747;outline-offset:5px}
.name{display:block;font:400 1.55rem/1.2 var(--serif)}
.detail{display:block;margin-top:6px;font-size:.875rem;line-height:1.45}
.book{justify-content:flex-start;gap:22px;padding:24px;background:var(--aubergine);color:var(--ivory);border-color:var(--aubergine);text-align:left;min-height:205px}
.book:hover{background:#361027}
.cover{width:96px;aspect-ratio:766/1084;flex-shrink:0;background:url('/assets/chemin-sacre-cover.jpg') 97.7% center/220% auto no-repeat;box-shadow:0 5px 14px #0004}
.book-copy{min-width:0}
.eyebrow{display:block;margin-bottom:10px;font-size:.75rem;letter-spacing:.13em;text-transform:uppercase}
.book .name{font-size:1.4rem;line-height:1.25}
.cta{display:inline-block;margin-top:16px;padding-bottom:3px;border-bottom:1px solid #f4efe799;font-size:.875rem}
footer{margin-top:28px;text-align:center;font-size:.875rem}
footer a{padding:10px;text-underline-offset:5px}
footer a:hover{text-decoration:underline}
@media(max-width:360px){main{width:calc(100% - 32px)}.book{padding:20px 16px;gap:16px}.cover{width:78px}.book .name{font-size:1.25rem}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<main>
<header><h1>Sarah <em>Msika</em></h1></header>
<nav aria-label="Les univers de Sarah Msika">
<a class="card book" href="https://www.amazon.fr/s?k=Un+chemin+sacr%C3%A9+vers+soi+Sarah+Msika+Alexis+Robic" aria-label="Précommander Un chemin sacré vers soi sur Amazon">
<span class="cover" aria-hidden="true"></span>
<span class="book-copy"><span class="eyebrow">Le livre</span><span class="name">Un chemin<br>sacré vers soi</span><span class="cta">Précommander le livre</span></span>
</a>
<a class="card" href="https://www.innesociety.com/"><span><span class="name">INNÉ Society</span><span class="detail">Corps · Esprit · Âme</span></span></a>
<a class="card" href="https://cultivate.fr/"><span><span class="name">Cultivate</span><span class="detail">cultivate.fr</span></span></a>
<a class="card" href="https://pointus.fr/"><span><span class="name">Pointus</span><span class="detail">Média indépendant et libre</span></span></a>
</nav>
<footer><a href="/">sarahmsika.com</a></footer>
</main>
</body>
</html>
